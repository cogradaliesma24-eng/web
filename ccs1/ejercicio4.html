<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Flexbox</title>
    <style>
        /* Variables y reset */
        :root {
            --padding-container: 50px 0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
        }
        
        /* Contenedor principal */
        .mi_contenedor {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            padding: var(--padding-container);
        }
        
        /* Menú de navegación */
        .mi_menu {
            display: flex;
            flex-flow: row nowrap;
            height: 100px;
            align-items: center;
            --padding-container: 0;
        }
        
        .logo {
            flex: 0 1 auto;
            max-width: 90px;
            min-width: 60px;
        }
        
        .logo img {
            width: 100%;
            height: auto;
        }
        
        .menu_nav {
            flex: 2 1 70%;
            display: flex;
            justify-content: space-evenly;
        }
        
        .menu_nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: color 0.3s;
        }
        
        .menu_nav a:hover {
            color: #4dabf7;
        }
        
        .menu_social {
            flex: 1 1 auto;
            display: flex;
            justify-content: space-evenly;
        }
        
        .menu_social a img {
            width: 32px;
            min-width: 28%;
            filter: brightness(0) invert(1);
        }
        
        /* Header principal */
        .mi_header {
            width: 100%;
            height: 100vh;
            min-height: 600px;
            max-height: 800px;
            position: relative;
            /* FONDO DE COLOR DE RESPALDO */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            clip-path: polygon(100% 0, 100% 85%, 50% 95%, 0 85%, 0 0);
        }
        
        /* Imagen de fondo - RUTA CORREGIDA */
        .mi_header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* AQUÍ ESTÁ TU IMAGEN - RUTA CORRECTA */
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.6) 100%), url('/ccs1/img/fondo_header.jpg');
            background-size: cover;
            background-position: center;
            clip-path: polygon(100% 0, 100% 85%, 50% 95%, 0 85%, 0 0);
            z-index: 1;
        }
        
        /* Contenido del header */
        .header_container {
            height: 75%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            text-align: center;
            max-width: 800px;
            position: relative;
            z-index: 2;
        }
        
        .header_title {
            font-size: 3rem;
            padding: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .header_paragraph {
            font-size: 1.2rem;
            line-height: 2rem;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        .cta {
            display: inline-block;
            background-color: #4dabf7;
            align-self: center;
            color: white;
            padding: 13px 30px;
            border-radius: 32px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .cta:hover {
            background-color: #339af0;
            transform: translateY(-2px);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .mi_menu {
                flex-direction: column;
                height: auto;
                padding: 20px 0;
            }
            
            .menu_nav {
                flex-direction: column;
                gap: 10px;
                margin: 15px 0;
            }
            
            .header_title {
                font-size: 2rem;
            }
            
            .header_paragraph {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="mi_header">
        <nav class="mi_menu mi_contenedor">
            <div class="logo">
                <a href="#">
                    <svg width="80" height="40" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg">
                        <rect width="80" height="40" fill="none"/>
                        <path d="M20,10 L30,30 L40,10 L50,30 L60,10" stroke="white" stroke-width="3" fill="none"/>
                        <circle cx="70" cy="20" r="8" stroke="white" stroke-width="2" fill="none"/>
                    </svg>
                </a>
            </div>
            <nav class="menu_nav">
                <a href="#">Inicio</a>
                <a href="#">Contacto</a>
                <a href="#">Acerca de</a>
                <a href="#">Blog</a>
            </nav>
            <div class="menu_social">
                <a href="#">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z" stroke="white" stroke-width="2"/>
                        <path d="M3 16V8C3 5.23858 5.23858 3 8 3H16C18.7614 3 21 5.23858 21 8V16C21 18.7614 18.7614 21 16 21H8C5.23858 21 3 18.7614 3 16Z" stroke="white" stroke-width="2"/>
                        <path d="M17.5 6.51L17.51 6.49889" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <a href="#">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 13.4876 3.36093 14.891 4 16.1272L3 21L7.8728 20C9.10905 20.6391 10.5124 21 12 21Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M8 12H16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 8V16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <a href="#">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 12L10.5 14V10L14 12Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12Z" stroke="white" stroke-width="2"/>
                    </svg>
                </a>
            </div>
        </nav>
        <section class="header_container mi_contenedor">
            <h1 class="header_title">Vamos a aprender CSS</h1>
            <p class="header_paragraph">
                Este es un sitio de prueba para practicar Flexbox en CSS.
                Cuando termines esta actividad, serás capaz de crear diseños flexibles y responsivos para tus proyectos web.
            </p>
            <a href="#" class="cta">Saber más</a>
        </section>
    </header>
</body>
</html>
